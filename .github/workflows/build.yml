name: Build GuardianAI Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: "dist/*.exe"
          - os: macos-latest
            platform: mac
            artifact: "dist/*.dmg"
          - os: ubuntu-latest
            platform: linux
            artifact: "dist/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y rpm fakeroot dpkg

      - run: npm install

      - name: Build
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ matrix.artifact }}
          asset_name: GuardianAI-${{ matrix.platform }}-${{ github.ref_name }}
          asset_content_type: application/octet-stream

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.artifact }}
          if-no-files-found: warn

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" | sort

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "GuardianAI Desktop ${{ github.ref_name }}"
          artifacts: "dist/*.exe,dist/*.dmg,dist/*.AppImage"
          artifactErrorsFailBuild: false
          body: |
            ## GuardianAI Desktop ${{ github.ref_name }}

            **The Security Layer for AI Systems** — by Neuronium Engineers

            ### Download for your platform:
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `*.exe` |
            | 🍎 macOS | `*.dmg` |
            | 🐧 Linux | `*.AppImage` |

            ### Quick Setup
            1. Download installer for your platform
            2. Install (Windows: run .exe, macOS: drag to Applications, Linux: chmod +x then run)
            3. Open GuardianAI → Settings → enter API key
            4. Get your key: https://guardianai-self.vercel.app/keys
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
