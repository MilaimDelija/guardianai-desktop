name: Build GuardianAI Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: warn

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: sudo apt-get install -y rpm fakeroot dpkg
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: release-files

      - name: List files
        run: ls -la release-files/

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-files/*"
          name: "GuardianAI Desktop ${{ github.ref_name }}"
          body: |
            ## GuardianAI Desktop ${{ github.ref_name }}
            **The Security Layer for AI Systems** — by Neuronium Engineers

            ### Download
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `.exe` installer |
            | 🍎 macOS | `.dmg` disk image |
            | 🐧 Linux | `.AppImage` |

            ### Setup
            1. Install and launch GuardianAI
            2. **Settings** → enter API key (`gai_live_xxx`)
            3. Get key at https://guardianai-self.vercel.app/keys
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifactErrorsFailBuild: false
