name: Build GuardianAI Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows
        run: npx electron-builder --win --x64 --publish never
        env:
          DEBUG: electron-builder
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: warn

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build macOS
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.dmg
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Linux build deps
        run: sudo apt-get install -y rpm fakeroot dpkg
      - name: Build Linux
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          name: GuardianAI Desktop ${{ github.ref_name }}
          body: |
            ## GuardianAI Desktop ${{ github.ref_name }}
            **The Security Layer for AI Systems** — by Neuronium Engineers

            | Platform | Download |
            |----------|----------|
            | Windows | `GuardianAI-Setup-*.exe` |
            | macOS | `GuardianAI-*.dmg` |
            | Linux | `GuardianAI-*.AppImage` |

            **Setup:** Launch → Settings → Enter API key from https://guardianai-self.vercel.app/keys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
